<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Test UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-base text-gray-100">
  <button class="m-10 p-4 bg-red-500 rounded" onclick="openLogoutModal()">Test Logout Modal</button>

  <!-- Logout Confirmation Modal (Copied from index.html) -->
  <div id="logoutModalBackdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-[100] flex items-center justify-center" onclick="closeLogoutModalOnBackdrop(event)">
    <div class="bg-elevated border border-white/10 rounded-2xl w-full max-w-[340px] p-6 text-center" onclick="event.stopPropagation()">
      <div class="w-16 h-16 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
      <h3 class="text-[18px] font-bold text-gray-100 mb-2">Confirm Logout</h3>
      <p class="text-[14px] text-gray-500 mb-6">Are you sure you want to log out of your account?</p>
      <div class="flex flex-col gap-2">
        <button class="w-full py-3 bg-red-500 hover:bg-red-600 text-white text-[14px] font-bold rounded-xl transition-colors shadow-lg shadow-red-500/20" onclick="alert('Logged out (mock)')">Logout</button>
        <button class="w-full py-3 bg-white/5 hover:bg-white/10 text-gray-400 text-[14px] font-medium rounded-xl transition-colors" onclick="closeLogoutModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    function openLogoutModal() {
      document.getElementById("logoutModalBackdrop").classList.remove("hidden");
    }
    function closeLogoutModal() {
      document.getElementById("logoutModalBackdrop").classList.add("hidden");
    }
    function closeLogoutModalOnBackdrop(e) {
      if (e.target === e.currentTarget) closeLogoutModal();
    }
  </script>
</body>
</html>
